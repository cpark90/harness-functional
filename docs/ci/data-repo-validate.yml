# Data-repo CI gate (D4, docs/federation-design.md).
#
# DEPRECATED / reference-only: this PURE-DATA-repo template is superseded by the
# recipe-repo glob CI (tools/gen_recipe_catalog.py generates the recipe catalog +
# CI matrix). No live pure-data repo currently uses it; kept as a worked example
# of the central-schema union pattern. Env values below are illustrative.
#
# Drop this into a PURE-DATA ontology repo as .github/workflows/validate.yml.
# It pulls the central schema+tooling repo, composes the UNION (central TBox +
# core data + this repo's data unit) and runs the central validate.py so every
# PR is held to the same anti-orphan / anti-drift / buildable invariants as the
# central repo. A non-zero exit fails the check.
#
# Assumptions (edit the three env values for your repo):
#   * this repo contains one data unit TTL that declares
#       <https://harness-ontology.dev/data/<domain>> a owl:Ontology ;
#           owl:imports <https://harness-ontology.dev/schema> ,
#                       <https://harness-ontology.dev/data/core/tools> ,
#                       ... (each central .../data/core/<type> unit it references) .
#     and mints individuals under .../id/<domain>/<slug> (ONTOLOGYSTYLE §2a). The
#     core parts library is split per component type, grouped into DA-4 taxonomy
#     subdirs (ontology/abox/core/<group>/<type>.ttl; the logical
#     .../data/core/<type> IRI is position-independent, the catalog is the
#     IRI->path map), so map every .../data/core/<type> IRI, not a single
#     .../data/core.
#   * this repo ships a catalog-v001.xml mapping every imported IRI to a local
#     path, e.g.:
#       <uri name="https://harness-ontology.dev/schema"    uri="central/ontology/tbox/harness.ttl"/>
#       <uri name="https://harness-ontology.dev/data/core/tools" uri="concrete/ontology/abox/core/operational/tools.ttl"/>
#       ... (one <uri> per .../data/core/<type> unit) ...
#       <uri name="https://harness-ontology.dev/data/<domain>" uri="<domain>.ttl"/>
#
# !! STALE AFTER THE 2026-09 LADDER SPLIT — this template checks out ONE repo,
#    but the two halves it needs now live in two:
#      * harness-functional (checked out below as ./central) — the TBox schema,
#        the SHACL shapes and the tooling (validate.py resolves shapes via
#        lib.ONT_DIR, i.e. under the checkout that holds validate.py, so shapes
#        keep coming from here).
#      * harness-concrete   — the ABox core parts library (.../data/core/<type>).
#        There is NO ontology/abox in harness-functional any more, so a data repo
#        that imports any .../data/core/<type> unit must check harness-concrete
#        out as well (e.g. path: concrete) and point those catalog entries at it.
#    The job below has not been updated for that second checkout and has no live
#    user; treat it as a worked example of the union pattern, not a drop-in file.
name: validate-ontology-data

on:
  push:
    branches: [main]
  pull_request:

env:
  # The central schema+tooling repo (owner/name). Change to your fork/mirror.
  CENTRAL_REPO: cpark90/harness-functional
  CENTRAL_REF: main
  # This data repo's ontology (document) IRI — its import closure IS the union.
  # Example domain only (ONTOLOGYSTYLE §2a); set to your own .../data/<domain>.
  HARNESS_ROOT_ONTOLOGY: https://harness-ontology.dev/data/acme-support

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out this data repo
        uses: actions/checkout@v4

      - name: Check out the central schema + tooling repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CENTRAL_REPO }}
          ref: ${{ env.CENTRAL_REF }}
          path: central

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (from the central repo)
        run: pip install -r central/requirements.txt

      - name: Validate the union (central tools + this repo's data)
        # HARNESS_CATALOG points the central loader at THIS repo's catalog, which
        # maps the central IRIs to ./central/** and its data unit to the local
        # TTL. Shapes come from the central checkout (lib.ONT_DIR). PASS required.
        env:
          HARNESS_CATALOG: ${{ github.workspace }}/catalog-v001.xml
        run: python3 central/tools/validate.py
