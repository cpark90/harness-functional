# CI gate for contributions to the FUNCTIONAL repo. Every push / pull request
# must keep the vocabulary well-typed and internally consistent — the same
# invariants the local tools enforce. A non-zero exit fails the check.
# (Rationale: agentic-knowledge-base decision chunks d-0013/d-0014; the former
# docs/DESIGN.md was retired into those chunks in the 2026-09 reorg.)
#
# SCOPE: this repo holds no individuals, so the instance-dependent axes
# (reachability, capability satisfaction, assembly order, capacity fit) pass
# vacuously here and are really enforced by harness-concrete's union gate.
# Equivalent local command: `make validate`.
name: validate-ontology

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate ontology (anti-orphan / anti-drift / buildable)
        run: python3 tools/validate.py
      - name: Check projection determinism (same request => same context pack)
        # Deliberately does NOT pin PYTHONHASHSEED — pinning hides the bug.
        run: python3 tools/check_determinism.py
      - name: Lint authoring uniformity (ONTOLOGYSTYLE §1c/§1d/§2 — beyond graph integrity)
        # validate.py checks graph integrity; this guards the *authoring* axis it
        # can't see — tokenEstimate coverage, prefix table, Hangul/English policy.
        run: python3 tools/lint_uniformity.py
